; extconfig.conf  -- maps Asterisk realtime families to database tables.
;
; The engine here is "pgsql" (native res_config_pgsql, configured in
; res_pgsql.conf), NOT odbc. Syntax: <family> => pgsql,<dbname>,<table> where
; <dbname> matches dbname in res_pgsql.conf. Install as /etc/asterisk/extconfig.conf.
;
; With these mappings, res_pjsip reads endpoints/auths/aors/etc from PostgreSQL,
; so the GUI provisions telephony by writing rows -- no .conf edits.

[settings]

; --- PJSIP objects (endpoints, trunks, extensions device side) ---
ps_endpoints       => pgsql,tpbx,ps_endpoints
ps_auths           => pgsql,tpbx,ps_auths
ps_aors            => pgsql,tpbx,ps_aors
ps_contacts        => pgsql,tpbx,ps_contacts
ps_endpoint_id_ips => pgsql,tpbx,ps_endpoint_id_ips
ps_registrations   => pgsql,tpbx,ps_registrations

; --- Dialplan (inbound/outbound routing) as realtime extensions ---
; The GUI writes routing logic into an `extensions` table that Asterisk reads
; via the "extensions" realtime family. (Added in a later phase.)
; extensions       => pgsql,tpbx,extensions

; --- Queues (ACD in-groups) read live from the database ---
; The console writes queues and their members straight into Asterisk's own
; realtime tables, so creating an in-group or an agent joining one takes effect
; with no file edit and no reload. Requires migration 0030_ingroups.sql.
queues             => pgsql,tpbx,queues
queue_members      => pgsql,tpbx,queue_members

; --- Queue (ACD) event log -> the call-center dashboard's data source ---
; app_queue writes every queue event (ENTERQUEUE/CONNECT/ABANDON/COMPLETE*/…)
; into this table in real time, so Service Level, Calls Offered/Handled/
; Abandoned, AHT and live In-Queue/Talking are computed from live data.
; Requires migration 0023_queue_log.sql. See docs/CALL_CENTER.md.
queue_log          => pgsql,tpbx,queue_log
